<html>
<head>
    <title>Practica 52</title>
    <style>
        .narrow {
	    height:100px;/* Ajusta el alto  que desees */
            width: 70px; /* Ajusta el ancho que desees */
        }
    </style>
</head>
<body>
    <table cellpadding="8" border="1" width="70%">
        <tr>
            <td  align="center"colspan="5">1</td>

        </tr>
        <tr>
            <td align="left" valign="top"class="narrow" rowspan="4">2</td>	
            <td class="narrow" align="right" valign="top" rowspan="2">3</td>	
            <td valign="bottom"colspan="2">4</td>
            <td class="narrow" valign="top" rowspan="4">5</td>
        </tr>
        <tr>	
            <td align="center" colspan="2">6</td>
        </tr>
        <tr>	
            <td align="right" valign="top" colspan="2">7</td>
            <td class="narrow" valign="top" rowspan="2">9</td>
        </tr>
        <tr>	
            <td align="center" valign="bottom" colspan="2">8</td>
        </tr>
        <tr>
            <td colspan="5">10</td>
        </tr>
    </table>
</body>
</html>
