<div style="text-align: center;">
  <button onclick="enviar()">Enviar</button>
  <button onclick="borrar()">Borrar</button>
</div>

<script>
    function mostrarURL(selectElement) {
        const redSocial = selectElement.value;
        const tdDireccion = selectElement.closest('tr').querySelector('.direccion');

        const urls = {
            facebook: 'https://www.facebook.com',
            twitter: 'https://www.twitter.com',
            instagram: 'https://www.instagram.com'
        };

        tdDireccion.textContent = urls[redSocial] || '';
    }
 function enviar() {
    alert("Formulario enviado (simulado)");
  }

function borrar() {
  const selects = document.querySelectorAll('select');
  const direcciones = document.querySelectorAll('.direccion');

  selects.forEach(select => {
    select.selectedIndex = 0; // Restablece el menú desplegable
  });

  direcciones.forEach(td => {
    td.textContent = ''; // Limpia la celda de dirección
  });
}

</script>
